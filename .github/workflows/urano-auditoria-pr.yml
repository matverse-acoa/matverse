name: URANO AuditoriaPR

on:
  pull_request:
    paths:
      - "urano/**"
      - ".github/workflows/urano-auditoria-pr.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s urano/auditoria_pr/tests -v
